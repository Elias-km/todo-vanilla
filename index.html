
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple Vanilla JavaScript task list with undo, redo and local storage."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>ToDo List Vanilla</title>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section class="card" aria-labelledby="app-title">
        <h1 id="app-title" class="title">ToDo List Vanilla</h1>

        <p class="description">
          Organize your tasks with a simple, lightweight app.
          Add and remove items, select multiple tasks, undo and redo
          changes, and keep your list automatically saved in your browser.
        </p>

        <div data-list-slot></div>
        <p class="sr-only" data-status role="status"></p>

        <div class="actions">
          <div class="actions-left">
            <button
              type="button"
              class="icon-button"
              data-undo
              aria-label="Undo"
              title="Undo"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 7L6 11L10 15" />
                <path d="M6 11H13C16.866 11 20 14.134 20 18" />
              </svg>
            </button>

            <button
              type="button"
              class="icon-button"
              data-redo
              aria-label="Redo"
              title="Redo"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 7L18 11L14 15" />
                <path d="M18 11H11C7.134 11 4 14.134 4 18" />
              </svg>
            </button>

            <button
              type="button"
              class="ghost-button"
              data-remove
              disabled
            >
              DELETE
            </button>
          </div>

          <div class="actions-right">
            <button
              type="button"
              class="icon-button"
              data-share
              aria-label="Share"
              title="Share"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="18" cy="5" r="2" />
                <circle cx="6" cy="12" r="2" />
                <circle cx="18" cy="19" r="2" />
                <path d="M8 12L16 6.5" />
                <path d="M8 12L16 17.5" />
              </svg>
            </button>

            <button
              type="button"
              class="primary-button"
              data-open-add
            >
              ADD
            </button>
          </div>
        </div>

        <p class="share-feedback" data-share-feedback role="status" hidden></p>

      </section>

      <div data-form-slot></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

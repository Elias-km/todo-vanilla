
<dialog aria-labelledby="todo-dialog-title">
  <div data-modal>
    <form>
      <label id="todo-dialog-title" for="todo-input">
        Add item to list
      </label>

      <input
        id="todo-input"
        type="text"
        placeholder="Type the text here..."
        autocomplete="off"
        autofocus
        required
      />

      <div data-actions>
        <button type="submit" data-submit>ADD</button>
        <button type="button" data-cancel>CANCEL</button>
      </div>
    </form>
  </div>
</dialog>
